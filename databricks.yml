bundle:
  name: smart-city-lakehouse


include:
  - conf/*.yml


variables:
  catalog_name:
    description: "The Unity Catalog name"
  schema_name:
    description: "The Schema (Database) name"
  volume_path:
    description: "Path to the S3 volume"
  service_principal_id:
    description: "Service Principal UUID for Prod"

targets:
  dev:
    mode: development    
    default: true        


  prod:
    mode: production     
    run_as:
      service_principal_name: ${var.service_principal_id}
    workspace:
      root_path: /Shared/.bundle/prod/${bundle.name}
    permissions:
      - level: CAN_MANAGE
        group_name: users


resources:
  pipelines:
    smart_city_pipeline:
      name: smart_city_pipeline_${bundle.target} 
      
    
      catalog: ${var.catalog_name}
      target:  ${var.schema_name}  
      
    
      libraries:
        - file:
            path: ./src/pipeline/dlt_proj_pipeline.py
      
   
      serverless: true
      
     
      configuration:
        "spark.databricks.delta.preview.enabled": "true"
        "my.project.volume_path": "${var.volume_path}"
        "my.project.env": "${bundle.target}"
